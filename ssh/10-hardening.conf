# /etc/ssh/sshd_config.d/10-hardening.conf
#
# A drop-in, not an edit to sshd_config, so a package upgrade that replaces
# the main file does not take the hardening with it.
#
# This only works if sshd_config contains:
#   Include /etc/ssh/sshd_config.d/*.conf
# Without that line the file below is inert and everything still looks fine.
# verify-baseline.sh checks for exactly this.

Port 2222

# Authentication
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 20

# Restrict who may authenticate at all, not just who has a key.
AllowUsers svcadmin

# Reduce what a session can reach back through.
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no

# Drop dead sessions rather than leaving them authenticated.
ClientAliveInterval 300
ClientAliveCountMax 2
